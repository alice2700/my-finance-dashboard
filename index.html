<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3D4A3F" />
<title>理財誌</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="理財誌" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-title">理財誌</div>
    <div class="topbar-updated" id="updatedAt">尚未載入資料</div>
    <button id="logoutBtn" class="logout-btn hidden">登出</button>
  </header>

  <section id="page-login">
    <div class="card login-card">
      <div class="card-title">登入</div>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required />
        <input type="password" id="loginPassword" placeholder="密碼" autocomplete="current-password" required />
        <button type="submit" id="loginSubmit">登入</button>
        <p id="loginError" class="login-error hidden"></p>
      </form>
    </div>
  </section>

  <main id="app" class="hidden">

    <!-- ============ 總覽 ============ -->
    <section class="page" id="page-overview">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label" id="labelAsset">資產淨值</div>
          <div class="stat-value" id="statAsset">—</div>
          <div class="stat-sub" id="statAssetGrowth"></div>
        </div>
        <div class="stat-card accent-income">
          <div class="stat-label" id="labelIncome">收入</div>
          <div class="stat-value" id="statIncome">—</div>
        </div>
        <div class="stat-card accent-expense">
          <div class="stat-label" id="labelExpense">生活支出</div>
          <div class="stat-value" id="statExpense">—</div>
        </div>
        <div class="stat-card" id="balanceCard">
          <div class="stat-label" id="labelBalance">結餘</div>
          <div class="stat-value" id="statBalance">—</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title-row">
          <div class="card-title">資產淨值走勢</div>
          <div class="segmented" id="assetSeriesToggle">
            <button class="segmented-btn active" data-series="total">總資產</button>
            <button class="segmented-btn" data-series="cash">現金</button>
            <button class="segmented-btn" data-series="stock">股票</button>
          </div>
        </div>
        <canvas id="chartAsset" height="180"></canvas>
        <div class="chart-hover-note" id="assetHoverNote"></div>
        <div class="market-note" id="marketContributionNote"></div>
      </div>

      <div class="card">
        <div class="card-title-row">
          <div class="card-title">每月淨結餘</div>
          <div class="segmented" id="rangeToggle">
            <button class="segmented-btn active" data-range="12">近12月</button>
            <button class="segmented-btn" data-range="all">全部</button>
          </div>
        </div>
        <canvas id="chartIncomeExpense" height="180"></canvas>
      </div>
    </section>

    <!-- ============ 現金流 ============ -->
    <section class="page hidden" id="page-cashflow">
      <div class="month-nav">
        <button id="cashflowPrevMonth" class="month-nav-btn" aria-label="上個月">‹</button>
        <span id="cashflowMonthLabel">—</span>
        <button id="cashflowNextMonth" class="month-nav-btn" aria-label="下個月">›</button>
      </div>
      <div class="card">
        <div class="card-title" id="labelIncomeFlow">收入來源</div>
        <div id="incomeFlow" class="flow-list"></div>
      </div>
      <div class="card">
        <div class="card-title" id="labelExpenseFlow">支出去向</div>
        <div id="expenseFlow" class="flow-list"></div>
      </div>
    </section>

    <!-- ============ 長期目標 ============ -->
    <section class="page hidden" id="page-goals">
      <div class="card">
        <div class="card-title">退休 / 財富自由</div>
        <div class="goal-row">
          <span id="goalCurrentAsset">—</span>
          <span class="goal-target" id="goalFireTarget">目標 —</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="fireProgressBar"></div></div>
        <div class="goal-note" id="fireProgressNote"></div>
      </div>

      <div class="card">
        <div class="card-title">購屋頭期款目標</div>
        <div class="goal-row"><span id="goalHouseTarget">—</span></div>
        <div class="goal-note" id="goalHouseNote"></div>
      </div>

      <div class="card">
        <div class="card-title">股票投入金額</div>
        <div class="goal-row">
          <span id="stockMonthInvested">—</span>
          <span class="goal-target">本月投入（買進，不含除息）</span>
        </div>
        <div class="goal-note" id="stockYearInvestedNote"></div>
      </div>
    </section>

    <!-- ============ 股票 ============ -->
    <section class="page hidden" id="page-stocks">
      <div class="card">
        <div class="card-title">持股配置</div>
        <canvas id="chartStocks" height="220"></canvas>
        <div id="stocksSummary" class="stat-sub" style="text-align:center;margin-top:10px;"></div>
      </div>
      <div class="card">
        <div class="card-title">台股</div>
        <div id="stockTableTW" class="stock-table"></div>
      </div>
      <div class="card">
        <div class="card-title">美股</div>
        <div id="stockTableUS" class="stock-table"></div>
      </div>
    </section>

    <div id="loadError" class="card error hidden">
      <div class="card-title">無法載入資料</div>
      <p id="loadErrorDetail"></p>
    </div>

  </main>

  <nav class="tabbar hidden">
    <button class="tab active" data-page="overview">
      <span>總覽</span>
    </button>
    <button class="tab" data-page="cashflow">
      <span>現金流</span>
    </button>
    <button class="tab" data-page="goals">
      <span>目標</span>
    </button>
    <button class="tab" data-page="stocks">
      <span>股票</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
