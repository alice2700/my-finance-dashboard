<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3D4A3F" />
<title>理財誌</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="理財誌" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-title">理財誌</div>
    <div class="topbar-updated" id="updatedAt">尚未載入資料</div>
    <button id="logoutBtn" class="logout-btn hidden">登出</button>
  </header>

  <section id="page-login">
    <div class="card login-card">
      <div class="card-title">登入</div>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required />
        <input type="password" id="loginPassword" placeholder="密碼" autocomplete="current-password" required />
        <button type="submit" id="loginSubmit">登入</button>
        <p id="loginError" class="login-error hidden"></p>
      </form>
    </div>
  </section>

  <main id="app" class="hidden">

    <!-- ============ 總覽 ============ -->
    <section class="page" id="page-overview">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label" id="labelAsset">資產淨值</div>
          <div class="stat-value" id="statAsset">—</div>
          <div class="stat-sub" id="statAssetGrowth"></div>
        </div>
        <div class="stat-card accent-income">
          <div class="stat-label" id="labelIncome">收入</div>
          <div class="stat-value" id="statIncome">—</div>
        </div>
        <div class="stat-card accent-expense">
          <div class="stat-label" id="labelExpense">生活支出</div>
          <div class="stat-value" id="statExpense">—</div>
        </div>
        <div class="stat-card" id="balanceCard">
          <div class="stat-label" id="labelBalance">結餘</div>
          <div class="stat-value" id="statBalance">—</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title-row">
          <div class="card-title">資產淨值走勢</div>
          <div class="segmented" id="assetSeriesToggle">
            <button class="segmented-btn active" data-series="total">總資產</button>
            <button class="segmented-btn" data-series="cash">現金</button>
            <button class="segmented-btn" data-series="stock">股票</button>
          </div>
        </div>
        <canvas id="chartAsset" height="180"></canvas>
        <div class="chart-hover-note" id="assetHoverNote"></div>
        <div class="market-note" id="marketContributionNote"></div>
      </div>

      <div class="card">
        <div class="card-title-row">
          <div class="card-title">每月淨結餘</div>
          <div class="segmented" id="rangeToggle">
            <button class="segmented-btn active" data-range="12">近12月</button>
            <button class="segmented-btn" data-range="all">全部</button>
          </div>
        </div>
        <canvas id="chartIncomeExpense" height="180"></canvas>
      </div>

      <div class="card">
        <div class="card-title-row">
          <div class="card-title">資產組成</div>
          <div id="assetCompositionLabel" class="stat-sub"></div>
        </div>
        <canvas id="chartAssetComposition" height="220"></canvas>
        <div id="assetComposition" class="flow-list" style="margin-top:14px;"></div>
      </div>
    </section>

    <!-- ============ 現金流 ============ -->
    <section class="page hidden" id="page-cashflow">
      <div class="month-nav">
        <button id="cashflowPrevMonth" class="month-nav-btn" aria-label="上一個">‹</button>
        <span id="cashflowMonthLabel">—</span>
        <button id="cashflowNextMonth" class="month-nav-btn" aria-label="下一個">›</button>
        <div class="segmented" id="cashflowRangeToggle">
          <button class="segmented-btn active" data-range="month">月</button>
          <button class="segmented-btn" data-range="year">年</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">預算狀態</div>
        <div id="budgetGroupsList"></div>
      </div>
      <div class="card">
        <div class="card-title" id="labelIncomeFlow">收入來源</div>
        <div id="incomeFlow" class="flow-list"></div>
      </div>
      <div class="card">
        <div class="card-title" id="labelExpenseFlow">支出去向</div>
        <div id="expenseFlow" class="flow-list"></div>
      </div>
      <div class="card">
        <div class="card-title">待銷帳（不列入統計）</div>
        <div id="pendingFlow" class="flow-list"></div>
      </div>
    </section>

    <!-- ============ 長期目標 ============ -->
    <section class="page hidden" id="page-goals">
      <div class="card">
        <div class="card-title">退休 / 財富自由</div>
        <div class="goal-row">
          <span id="goalCurrentAsset">—</span>
          <span class="goal-target" id="goalFireTarget">目標 —</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="fireProgressBar"></div></div>
        <div class="milestone-badges" id="fireMilestones">
          <span class="milestone-badge" data-milestone="25">25%</span>
          <span class="milestone-badge" data-milestone="50">50%</span>
          <span class="milestone-badge" data-milestone="75">75%</span>
          <span class="milestone-badge" data-milestone="100">100%</span>
        </div>
        <div class="goal-note" id="fireProgressNote"></div>
      </div>

      <div class="card">
        <div class="card-title">購屋頭期款目標</div>
        <div class="goal-row"><span id="goalHouseTarget">—</span></div>
        <div class="goal-note" id="goalHouseNote"></div>
      </div>

      <div class="card">
        <div class="card-title">年度儲蓄達成率</div>
        <div class="goal-row">
          <span id="savingsRateActual">—</span>
          <span class="goal-target" id="savingsRateTarget">目標 —</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="savingsRateBar"></div></div>
        <div class="goal-note" id="savingsRateNote"></div>
      </div>

      <div class="card">
        <div class="card-title">連續正結餘</div>
        <div class="goal-row"><span id="positiveStreakValue">—</span></div>
        <div class="goal-note" id="positiveStreakNote"></div>
      </div>

      <div class="card">
        <div class="card-title">股票投入金額</div>
        <div class="goal-row">
          <span id="stockMonthInvested">—</span>
          <span class="goal-target">本月投入（買進，不含除息）</span>
        </div>
        <div class="goal-note" id="stockYearInvestedNote"></div>
      </div>
    </section>

    <!-- ============ 股票 ============ -->
    <section class="page hidden" id="page-stocks">
      <div class="card">
        <div class="card-title">持股配置</div>
        <canvas id="chartStocks" height="220"></canvas>
        <div id="stocksSummary" class="stat-sub" style="text-align:center;margin-top:10px;"></div>
      </div>
      <div class="card">
        <div class="card-title">台股</div>
        <div id="stockTableTW" class="stock-table"></div>
      </div>
      <div class="card">
        <div class="card-title">美股</div>
        <div id="stockTableUS" class="stock-table"></div>
      </div>

      <div class="card">
        <div class="month-nav" style="margin-bottom:14px;">
          <button id="divPrevYear" class="month-nav-btn" aria-label="上一年">‹</button>
          <span id="divYearLabel">—</span>
          <button id="divNextYear" class="month-nav-btn" aria-label="下一年">›</button>
        </div>
        <div class="card-title">股利月曆</div>
        <canvas id="chartDividendMonthly" height="160"></canvas>
        <div class="dividend-table-wrap">
          <table class="dividend-table" id="dividendTable"></table>
        </div>
      </div>
    </section>

    <!-- ============ 明細 ============ -->
    <section class="page hidden" id="page-detail">
      <div class="month-nav">
        <button id="detailPrevMonth" class="month-nav-btn" aria-label="上一個">‹</button>
        <span id="detailMonthLabel">—</span>
        <button id="detailNextMonth" class="month-nav-btn" aria-label="下一個">›</button>
      </div>
      <div class="card">
        <div class="card-title-row">
          <div class="card-title">花費熱點</div>
          <div class="stat-sub" id="detailHeatLegend"></div>
        </div>
        <div class="filter-row">
          <div id="detailMidNameFilters" class="filter-chip-list"></div>
          <div class="filter-actions">
            <button type="button" id="detailFilterAll" class="filter-text-btn">全選</button>
            <button type="button" id="detailFilterNone" class="filter-text-btn">清除</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendarWeekdays"></div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      <div class="card">
        <div class="card-title" id="detailDayLabel">選一天看逐筆明細</div>
        <div id="detailDayList" class="flow-list"></div>
      </div>
    </section>

    <!-- ============ 輸入 ============ -->
    <section class="page hidden" id="page-input">
      <div class="card">
        <div class="card-title">新增資產快照</div>
        <form id="balanceForm" class="entry-form">
          <label>帳戶名稱
            <input list="accountNames" id="balAccountName" autocomplete="off" required />
            <datalist id="accountNames">
              <option value="國泰-證券"></option>
              <option value="國泰-生活"></option>
              <option value="國泰-備用"></option>
              <option value="富邦"></option>
              <option value="linebank-主帳戶"></option>
              <option value="linebank-口袋帳戶"></option>
              <option value="郵局"></option>
              <option value="台幣定存"></option>
              <option value="外幣定存"></option>
              <option value="外幣活存"></option>
              <option value="股票"></option>
            </datalist>
          </label>
          <label>帳戶類型
            <select id="balAccountType" required>
              <option value="cash">活期存款</option>
              <option value="investment">定存 / 其他投資</option>
              <option value="stock">股票</option>
            </select>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="balIsForeign" />
            外幣帳戶（美金，自動換算台幣）
          </label>
          <div id="foreignFields" class="hidden">
            <label>美金金額
              <input type="number" id="balUsdAmount" inputmode="decimal" step="0.01" />
            </label>
            <div class="rate-row">
              <button type="button" id="fetchRateBtn">抓即時匯率</button>
              <span id="rateDisplay"></span>
            </div>
          </div>
          <label id="balAmountLabel">餘額
            <input type="number" id="balAmount" inputmode="decimal" step="1" required />
          </label>
          <label>日期
            <input type="date" id="balDate" required />
          </label>
          <label>備註（選填）
            <input type="text" id="balNote" />
          </label>
          <button type="submit" id="balSubmit">新增</button>
          <p id="balMessage" class="entry-message hidden"></p>
        </form>
      </div>
      <div class="card">
        <div class="card-title">這次新增的紀錄</div>
        <div id="balanceRecent" class="flow-list"></div>
      </div>

      <div class="card">
        <div class="card-title">匯入證券對帳單（CSV）</div>
        <input type="file" id="stockCsvFile" accept=".csv,text/csv" class="entry-form" style="padding:10px;" />
        <div id="stockCsvStatus" class="entry-message" style="margin-top:8px;"></div>
        <div id="stockCsvPreview" style="margin-top:10px;"></div>
        <button type="button" id="stockCsvConfirm" class="hidden" style="margin-top:10px;width:100%;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;font-family:inherit;background:var(--sage);color:#fff;cursor:pointer;">確認匯入</button>
      </div>

      <div class="card">
        <div class="card-title">信用卡/銀行明細比對</div>
        <input type="file" id="reconcileFile" accept=".csv,.xlsx,.xls,text/csv" class="entry-form" style="padding:10px;" />
        <div id="reconcileStatus" class="entry-message" style="margin-top:8px;"></div>
        <div id="reconcileResult" style="margin-top:10px;"></div>
      </div>
    </section>

    <div id="loadError" class="card error hidden">
      <div class="card-title">無法載入資料</div>
      <p id="loadErrorDetail"></p>
    </div>

  </main>

  <nav class="tabbar hidden">
    <button class="tab active" data-page="overview">
      <span>總覽</span>
    </button>
    <button class="tab" data-page="cashflow">
      <span>現金流</span>
    </button>
    <button class="tab" data-page="goals">
      <span>目標</span>
    </button>
    <button class="tab" data-page="stocks">
      <span>股票</span>
    </button>
    <button class="tab" data-page="detail">
      <span>明細</span>
    </button>
    <button class="tab" data-page="input">
      <span>輸入</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
