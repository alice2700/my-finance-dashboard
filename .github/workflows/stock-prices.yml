name: Fetch Stock Closing Prices

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC = 06:00 Taiwan time (both TW and US markets closed by then)
  workflow_dispatch: {}

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and upsert stock prices
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fetch-stock-prices.mjs
