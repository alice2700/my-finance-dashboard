name: Supabase Daily Backup

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 02:00 Taiwan time
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard repo (for export script)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Export Supabase tables to CSV
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-export.mjs ./tmp-backup

      - name: Checkout private backup repo
        uses: actions/checkout@v4
        with:
          repository: alice2700/finance-dashboard-backup
          token: ${{ secrets.BACKUP_REPO_PAT }}
          path: backup-repo

      - name: Copy CSVs into backup repo
        run: |
          mkdir -p backup-repo/tables
          cp tmp-backup/*.csv backup-repo/tables/

      - name: Commit and push if changed
        working-directory: backup-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tables/
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "Backup $(date -u +%Y-%m-%d)"
            git push
          fi
