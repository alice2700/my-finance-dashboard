name: Market Valuation Snapshot

on:
  schedule:
    - cron: '0 12 * * 1-5' # 12:00 UTC = 20:00 Taiwan time, weekdays (after TWSE/TPEx publish PER/PBR data)
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and upsert market snapshot
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/market-snapshot-fetch.mjs
