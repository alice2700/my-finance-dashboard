name: FinMind Fundamentals Refresh

on:
  workflow_dispatch: {} # run manually when needed (new holding added, or refreshing growth rates)

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch industry + EPS growth for held tickers
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/finmind-fundamentals.mjs
